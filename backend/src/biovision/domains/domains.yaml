# ===========================================================================
#  BioVision domain catalogue
# ===========================================================================
#
#  ADDING A DOMAIN IS ADDING AN ENTRY TO THIS FILE. There is no accompanying
#  code change: the router builds its zero-shot candidate set from `prompts`,
#  /v1/domains renders this list directly, and the specialist lookup treats a
#  missing `specialist` as a valid, honest answer.
#
#  tests/unit/test_domain_extensibility.py enforces this. If a future change
#  makes a code edit necessary to add a domain, that test fails.
#
#  Fields
#    key         stable identifier returned as AnalyzeResponse.domain
#    label       human-readable name
#    specialist  registry name of the expert model, or null when none exists
#    prompts     zero-shot text candidates for the CLIP/SigLIP router (Phase 3).
#                Several phrasings per domain: single-prompt zero-shot is brittle,
#                and the mean of a prompt ensemble is measurably more stable.
# ===========================================================================

version: 1

domains:
  - key: vehicle
    label: Vehicle
    specialist: vehicle_yolo
    prompts:
      - "a photo of a damaged car"
      - "a close-up photo of a dented car body panel"
      - "a photo of a scratched vehicle"
      - "a photo of a car with a broken headlight or shattered window"
      - "a photo of a vehicle after a traffic accident"

  - key: building
    label: Building
    specialist: null
    prompts:
      - "a photo of a cracked wall"
      - "a photo of water damage on a ceiling"
      - "a photo of a damaged building facade"
      - "a photo of structural damage to a house"
      - "a photo of a broken window in a building"

  - key: phone_screen
    label: Phone screen
    specialist: null
    prompts:
      - "a photo of a smartphone with a cracked screen"
      - "a close-up photo of a shattered phone display"
      - "a photo of a broken mobile phone"
      - "a photo of a damaged tablet screen"

  # Catch-all for photographs that pass the gate -- they genuinely show a damaged
  # object -- but belong to none of the domains above. Distinct from the "unknown"
  # key, which means the router was not confident enough to place the image at all.
  - key: other
    label: Other
    specialist: null
    prompts:
      - "a photo of a damaged object"
      - "a photo of a broken item"
      - "a photo of a damaged piece of furniture"
      - "a photo of a damaged package or parcel"
